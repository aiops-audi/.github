<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="SHIP HAPPENS. — AUDI AIOPS">
  <style>
    .mono { font: 500 11px ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace; fill:#6b6b66; letter-spacing:4px; }
    .display { font: 800 210px 'Space Grotesk','Inter','Helvetica Neue','Arial Black',Arial,sans-serif; letter-spacing:-10px; }
    .light { fill:#ebe8e1; }
    .lime { fill:#e4ff5c; }
    .sub { font: 800 56px 'Space Grotesk','Inter','Helvetica Neue','Arial Black',Arial,sans-serif; fill:#2b2b28; letter-spacing:-2px; }
    .prompt { font: 500 14px ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace; }
    .p1 { fill:#e4ff5c; } .p2 { fill:#5a5a55; }
    .desc { font: 400 16px 'Space Grotesk','Inter','Helvetica Neue',Arial,sans-serif; fill:#8a8a85; }
    .dot { animation: pulse 2s ease-in-out infinite; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:.25 } }
    @keyframes blink { 0%,100% { opacity:1 } 50% { opacity:0 } }
  </style>
  <defs>
    <clipPath id="typeclip"><rect x="0" y="0" height="40" width="0"><animate attributeName="width" values="0;10;19;28;37;46;55;64;73;83;92;92" dur="3.2s" calcMode="discrete" repeatCount="indefinite"/></rect></clipPath>
  </defs>
  <rect width="1200" height="640" fill="#0a0a0a"/>

  <circle class="dot" cx="44" cy="42" r="3.5" fill="#e4ff5c"/>
  <text x="58" y="46" class="mono">AI-OPS PLATFORM · AUDI</text>
  <text x="1160" y="46" class="mono" text-anchor="end">EST. 2026 — V1.0</text>

  <text x="32" y="270" class="display light">SHIP</text>
  <text x="32" y="450" class="display lime">HAPPENS.</text>
  <circle class="cursor" cx="1000" cy="432" r="20" fill="none" stroke="#ebe8e1" stroke-width="2"/>

  <rect x="40" y="510" width="1120" height="1" fill="#1f1f1f"/>
  <text x="40" y="548" class="prompt"><tspan class="p1">~/aiops-audi</tspan><tspan class="p2"> ›</tspan></text>
  <g transform="translate(170 532)" clip-path="url(#typeclip)">
    <text x="0" y="16" class="prompt p2">git push_</text>
  </g>
  <text x="40" y="584" class="desc">Infrastructure, pipelines and AI tooling for Audi — built in Rust, Python and JS.</text>
  <text x="40" y="610" class="desc">Clone a template, plug into the core, ship to prod.</text>
  <text x="1160" y="610" class="sub" text-anchor="end">AUDI AIOPS</text>
</svg>
